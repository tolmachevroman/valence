name: Release

# Push a tag like v0.1.0 (the version in app/src-tauri/tauri.conf.json) to
# build the app and attach its .dmg to a draft GitHub release. The draft is
# published by hand. The app is ad-hoc signed, not notarized: see the notes.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # rustup reads rust-toolchain.toml and installs the pinned version
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Tag matches the app version
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME, but the app is version $version"
            exit 1
          fi

      - name: Build
        working-directory: app
        run: |
          npm ci
          npm run tauri build

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release/bundle/dmg/*.dmg \
            --draft \
            --title "Valence ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
