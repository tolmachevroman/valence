[package]
name = "valence-core"
description = "Data clients, snippet extraction, cache, card generation and validation for Valence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# M0 model spike only; moves to [dependencies] when generation lands in M3.
# crates.io lags behind (0.8.1), so pin the release tag.
[dev-dependencies]
anyhow = "1"
libproc = "0.14"
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", tag = "v0.9.5", features = ["metal"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
