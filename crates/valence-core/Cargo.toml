[package]
name = "valence-core"
description = "Data clients, snippet extraction, cache, card generation and validation for Valence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
governor = "0.10"
regex = "1"
reqwest = "0.13"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

# M0 model spike only; moves to [dependencies] when generation lands in M3.
# mistral.rs v0.9.5 plus an opt-in macOS available-memory estimate (M0.6c),
# from our fork, pinned to the exact commit. Switch back to an upstream
# release once the change is merged there.
[dev-dependencies]
anyhow = "1"
libproc = "0.14"
mistralrs = { git = "https://github.com/tolmachevroman/mistral.rs", rev = "0516b52073eeded1ecbc3cbf4f214b5d6ad9aedb", features = ["metal"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
