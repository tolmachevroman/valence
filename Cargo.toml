[workspace]
resolver = "3"
members = ["crates/valence-core", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/tolmachevroman/valence"

# Full debug info for dependencies (mistral.rs, candle, Tauri) made target/debug
# about 26 GB; keep it for our own crates only.
[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
